name: EMA Squeeze Base Weekly Scan

on:
  schedule:
    # Friday, 18:00 IST = 12:30 UTC
    - cron: '30 12 * * 1,5'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # 752 symbols with a 0.5s delay + downloads can take a while
    permissions:
      contents: write     # Required for the "Commit match history" step to push back to the repo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas ta requests

      - name: Run scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ema_squeeze_base.py --explain AEGISLOG

      - name: Commit match history
        run: |
          git config user.email "bot@rkscanbot"
          git config user.name "RKScanBot"
          git add match_history.csv
          git commit -m "Log matches $(date +%F)" || echo "Nothing to commit"
          git push
