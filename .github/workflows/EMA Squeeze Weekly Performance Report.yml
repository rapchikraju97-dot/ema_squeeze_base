name: EMA Squeeze Weekly Performance Report

on:
  schedule:
    # Friday, 19:00 IST = 13:30 UTC (1 hour after the Friday 18:00 IST scan)
    - cron: '30 13 * * 5'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest match history
        run: |
          git pull origin main || git pull

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy ta requests

      - name: Generate & Send Weekly Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ema_squeeze_base_v2.py --weekly-report --report-lookback-weeks 8
