name: Backtest (Debug)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy ta requests
      - run: python ema_squeeze_base.py --backtest --lookback-weeks 52 --forward-weeks 8 --dry-run
