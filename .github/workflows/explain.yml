name: Explain Symbol (Debug)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'NSE symbol (CCL, INOXINDIA)'
        required: true
        default: 'CCL'

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy ta requests
      - run: python ema_squeeze_base_v3.py --explain ${{ github.event.inputs.symbol }}
