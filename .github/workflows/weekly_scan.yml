name: Weekly EMA Absorption Scanner

on:
  schedule:
    # Runs every Friday at 11:00 AM UTC (4:30 PM IST)
    - cron: '0 11 * * 5'
    # Optional weekend run: Every Sunday at 04:30 AM UTC (10:00 AM IST)
    - cron: '30 4 * * 0'
  workflow_dispatch: # Allows manual one-click trigger anytime from GitHub Actions tab

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance ta

      - name: Run Weekly Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python ema_squeeze_base_v2.py
